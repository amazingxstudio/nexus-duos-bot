<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Duos Game Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19; --card: #151c2c; --card-border: #232d42;
            --primary: #3b82f6; --accent: #ec4899; --success: #10b981;
            --warning: #f59e0b; --text: #f8fafc; --text-muted: #94a3b8;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        #app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .hidden { display: none !important; }

        .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .btn { width: 100%; padding: 12px 16px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; background: var(--primary); transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #2a3447; color: var(--text); }
        .btn-danger { background: #ef4444; }

        .profile-header { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .user-details { flex: 1; }
        .nickname-box { display: flex; gap: 8px; margin-top: 6px; }
        .input-field { background: #0b0f19; border: 1px solid var(--card-border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; width: 100%; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); margin-top: 8px; padding-top: 10px; font-size: 0.85rem; color: var(--text-muted); }
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a3447; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-card { background: #0b0f19; border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; }
        .game-card i { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }

        .history-item { background: #0b0f19; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .win { color: var(--success); }
        .loss { color: #ef4444; }

        .vote-card { background: #0b0f19; border: 1px solid var(--card-border); padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .vote-card.selected { border-color: var(--primary); background: rgba(59, 130, 246, 0.15); }

        .ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 16px auto; }
        .ttt-cell { aspect-ratio: 1; background: #0b0f19; border: 2px solid var(--card-border); border-radius: 12px; font-size: 2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--primary); }
        
        .rps-options { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
        .rps-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--primary); background: #0b0f19; font-size: 1.8rem; cursor: pointer; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-unconnected" class="view">
        <div class="card">
            <div class="profile-header">
                <img id="my-avatar" class="avatar" src="https://via.placeholder.com/64">
                <div class="user-details">
                    <div id="my-username" style="font-weight:700;">Loading...</div>
                    <div id="my-id" style="font-size:0.8rem; color:var(--text-muted);">ID: ------</div>
                    <div class="nickname-box">
                        <input type="text" id="my-nickname" class="input-field" placeholder="Set Nickname">
                        <button onclick="saveNickname()" class="btn" style="width: auto; padding: 6px 12px;"><i class="fa-solid fa-save"></i></button>
                    </div>
                </div>
            </div>
            <div class="toggle-row">
                <span><i class="fa-solid fa-eye"></i> Show History to All</span>
                <label class="switch">
                    <input type="checkbox" id="privacy-toggle" onchange="savePrivacy()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="card">
            <div style="font-weight: 700; margin-bottom: 10px;"><i class="fa-solid fa-robot"></i> Practice Mode (No Score)</div>
            <div class="grid-2">
                <div class="game-card" onclick="startPractice('tictactoe')">
                    <i class="fa-solid fa-xmark-large"></i><div>Tic-Tac-Toe</div>
                </div>
                <div class="game-card" onclick="startPractice('rps')">
                    <i class="fa-solid fa-hand-back-fist"></i><div>RPS</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="font-weight: 700; margin-bottom: 10px;"><i class="fa-solid fa-clock-rotate-left"></i> Match History</div>
            <div id="history-container">Loading matches...</div>
        </div>
    </div>

    <div id="view-connected" class="view hidden">
        <div class="card" style="text-align: center;">
            <h2 id="room-title" style="color: var(--primary);">Room</h2>
            <p id="room-status" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">Waiting for opponent...</p>

            <div id="voting-box" class="hidden">
                <div style="font-weight: 700; margin-bottom: 10px;">Select 3 Games (<span id="vote-count">0</span>/3)</div>
                <div id="voting-candidates">
                    <div class="vote-card" onclick="toggleVote('tictactoe')"><span>❌⭕ Tic-Tac-Toe</span></div>
                    <div class="vote-card" onclick="toggleVote('rps')"><span>✊✋✌️ RPS</span></div>
                </div>
                <button id="btn-submit-vote" class="btn btn-success" style="margin-top: 10px;" disabled onclick="submitVotes()">Submit Votes</button>
            </div>

            <div id="direct-box" class="hidden">
                <button onclick="startDirectGame()" class="btn btn-success">Start Game</button>
            </div>

            <button onclick="leaveRoom()" class="btn btn-secondary" style="margin-top: 12px;">Leave Room</button>
        </div>
    </div>

    <div id="view-game" class="view hidden">
        <div class="card" style="text-align: center;">
            <h3 id="game-title">Game Arena</h3>
            <div id="game-status-text" style="color: var(--warning); margin: 10px 0;">Connecting...</div>

            <div id="arena-ttt" class="ttt-board hidden">
                <div class="ttt-cell" onclick="handleTTTClick(0)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(1)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(2)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(3)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(4)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(5)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(6)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(7)"></div>
                <div class="ttt-cell" onclick="handleTTTClick(8)"></div>
            </div>

            <div id="arena-rps" class="rps-options hidden">
                <button class="rps-btn" onclick="handleRPSClick('rock')">✊</button>
                <button class="rps-btn" onclick="handleRPSClick('paper')">✋</button>
                <button class="rps-btn" onclick="handleRPSClick('scissors')">✌️</button>
            </div>

            <button onclick="exitArena()" class="btn btn-secondary" style="margin-top: 16px;">Back</button>
        </div>
    </div>
</div>

<script>
    const FIREBASE_DB = 'https://nexus-duos-default-rtdb.asia-southeast1.firebasedatabase.app';
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const tgUser = tg?.initDataUnsafe?.user || { id: '999999', username: 'Guest', first_name: 'Guest' };
    const USER_ID = String(tgUser.id);
    const USER_NAME = tgUser.username || tgUser.first_name;

    let state = {
        currentView: 'unconnected',
        roomId: null,
        roomData: null,
        isPractice: false,
        gameType: null,
        selectedVotes: [],
        pollingTimer: null,
        myTurn: false,
        mySymbol: '',
        oppId: null
    };

    async function fbCall(method, path, data = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (data) options.body = JSON.stringify(data);
        const res = await fetch(`${FIREBASE_DB}/${path}.json`, options);
        return res.json();
    }

    function switchView(v) {
        document.querySelectorAll('.view').forEach(e => e.classList.add('hidden'));
        document.getElementById(`view-${v}`).classList.remove('hidden');
        state.currentView = v;
    }

    async function init() {
        document.getElementById('my-username').innerText = `@${USER_NAME}`;
        document.getElementById('my-id').innerText = `ID: ${USER_ID}`;
        
        let dbUser = await fbCall('GET', `users/${USER_ID}`);
        if (!dbUser) {
            dbUser = { id: USER_ID, username: USER_NAME, nickname: USER_NAME, score: 0, showHistory: false };
            await fbCall('PUT', `users/${USER_ID}`, dbUser);
        }
        document.getElementById('my-nickname').value = dbUser.nickname || USER_NAME;
        document.getElementById('privacy-toggle').checked = !!dbUser.showHistory;

        loadHistory();

        const params = new URLSearchParams(window.location.search);
        if (params.get('room')) joinRoomProcess(params.get('room'));
        else switchView('unconnected');
    }

    // ========== ROOM & POLLING SYSTEM ==========
    async function joinRoomProcess(roomId) {
        state.roomId = roomId;
        switchView('connected');
        document.getElementById('room-title').innerText = `Room: ${roomId}`;

        let room = await fbCall('GET', `rooms/${roomId}`);
        if (!room) return;
        
        if (room.host !== USER_ID && !room.guest) {
            await fbCall('PATCH', `rooms/${roomId}`, { guest: USER_ID, guestName: USER_NAME, status: 'connected' });
        }
        startPolling();
    }

    function startPolling() {
        if (state.pollingTimer) clearInterval(state.pollingTimer);
        state.pollingTimer = setInterval(async () => {
            if (!state.roomId) return;
            const room = await fbCall('GET', `rooms/${state.roomId}`);
            if (!room) return;
            state.roomData = room;

            if (room.guest) {
                document.getElementById('room-status').innerText = 'Players connected!';
                state.oppId = room.host === USER_ID ? room.guest : room.host;
                
                if (room.mode === 'direct' && room.status !== 'playing') {
                    document.getElementById('direct-box').classList.remove('hidden');
                    state.gameType = room.game;
                }
                
                // Real-time Multiplayer Sync
                if (room.status === 'playing') {
                    state.gameType = room.selectedGame;
                    if (state.currentView !== 'game') {
                        launchMultiplayerArena();
                    } else if (room.gameState) {
                        syncGameState(room.gameState);
                    }
                }
            }
        }, 1000); // Poll every 1 second
    }

    async function startDirectGame() {
        // Host initializes the empty game board in Firebase
        await fbCall('PATCH', `rooms/${state.roomId}`, { 
            status: 'playing', 
            selectedGame: state.gameType,
            gameState: { 
                turn: USER_ID, // Host goes first
                board: ['', '', '', '', '', '', '', '', ''],
                winner: null,
                p1Rps: null, p2Rps: null
            }
        });
    }

    // ========== MULTIPLAYER GAME ARENA ==========
    function launchMultiplayerArena() {
        switchView('game');
        document.getElementById('game-title').innerText = `${state.gameType.toUpperCase()} (Ranked)`;
        document.getElementById('arena-ttt').classList.add('hidden');
        document.getElementById('arena-rps').classList.add('hidden');

        state.mySymbol = state.roomData.host === USER_ID ? 'X' : 'O';

        if (state.gameType === 'tictactoe') document.getElementById('arena-ttt').classList.remove('hidden');
        if (state.gameType === 'rps') document.getElementById('arena-rps').classList.remove('hidden');
    }

    function syncGameState(gs) {
        if (gs.winner) {
            if (gs.winner === 'draw') document.getElementById('game-status-text').innerText = '🤝 Draw!';
            else document.getElementById('game-status-text').innerText = gs.winner === USER_ID ? '🎉 You Won!' : '💀 You Lost!';
            return;
        }

        if (state.gameType === 'tictactoe') {
            state.myTurn = (gs.turn === USER_ID);
            document.getElementById('game-status-text').innerText = state.myTurn ? `Your Turn (${state.mySymbol})` : `Opponent's Turn`;
            
            // Sync UI Board
            const cells = document.querySelectorAll('.ttt-cell');
            gs.board.forEach((val, i) => cells[i].innerText = val);
        }
        else if (state.gameType === 'rps') {
            const myRps = state.roomData.host === USER_ID ? gs.p1Rps : gs.p2Rps;
            const oppRps = state.roomData.host === USER_ID ? gs.p2Rps : gs.p1Rps;
            
            if (!myRps) document.getElementById('game-status-text').innerText = 'Pick your move!';
            else if (myRps && !oppRps) document.getElementById('game-status-text').innerText = 'Waiting for opponent...';
            
            // If both selected, host calculates winner (to prevent double scoring)
            if (myRps && oppRps && state.roomData.host === USER_ID) {
                let winner = 'draw';
                if ((gs.p1Rps==='rock' && gs.p2Rps==='scissors') || (gs.p1Rps==='paper' && gs.p2Rps==='rock') || (gs.p1Rps==='scissors' && gs.p2Rps==='paper')) winner = state.roomData.host;
                else if (gs.p1Rps !== gs.p2Rps) winner = state.roomData.guest;
                
                fbCall('PATCH', `rooms/${state.roomId}/gameState`, { winner: winner });
                if(winner === 'draw') finishGame(5, 5);
                else if(winner === state.roomData.host) finishGame(10, 0);
                else finishGame(0, 10);
            }
        }
    }

    async function handleTTTClick(idx) {
        if (state.isPractice) return handlePracticeTTT(idx);

        if (!state.myTurn || !state.roomData.gameState) return;
        let board = state.roomData.gameState.board || Array(9).fill('');
        if (board[idx] !== '') return;

        // Make move
        board[idx] = state.mySymbol;
        document.querySelectorAll('.ttt-cell')[idx].innerText = state.mySymbol;
        state.myTurn = false; 

        // Check Win
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        let isWin = wins.some(w => w.every(i => board[i] === state.mySymbol));
        let isDraw = !isWin && board.every(c => c !== '');

        let updateData = { board: board, turn: state.oppId };
        if (isWin) { updateData.winner = USER_ID; finishGame(10, 0); }
        else if (isDraw) { updateData.winner = 'draw'; finishGame(5, 5); }

        await fbCall('PATCH', `rooms/${state.roomId}/gameState`, updateData);
    }

    async function handleRPSClick(choice) {
        if (state.isPractice) return;
        const isHost = state.roomData.host === USER_ID;
        const payload = isHost ? { p1Rps: choice } : { p2Rps: choice };
        await fbCall('PATCH', `rooms/${state.roomId}/gameState`, payload);
    }

    // ========== PRACTICE (BOT) MODE ==========
    function startPractice(game) {
        state.isPractice = true; state.gameType = game;
        switchView('game');
        document.getElementById('game-title').innerText = `${game.toUpperCase()} (AI Practice)`;
        document.getElementById('arena-ttt').classList.add('hidden');
        document.getElementById('arena-rps').classList.add('hidden');
        if (game === 'tictactoe') { document.getElementById('arena-ttt').classList.remove('hidden'); state.tttBoard = Array(9).fill(''); document.querySelectorAll('.ttt-cell').forEach(c=>c.innerText=''); state.myTurn = true; document.getElementById('game-status-text').innerText = 'Your Turn (X)'; }
        if (game === 'rps') { document.getElementById('arena-rps').classList.remove('hidden'); document.getElementById('game-status-text').innerText = 'Pick your move!'; }
    }

    function handlePracticeTTT(idx) {
        if (!state.myTurn || state.tttBoard[idx] !== '') return;
        state.tttBoard[idx] = 'X'; document.querySelectorAll('.ttt-cell')[idx].innerText = 'X'; state.myTurn = false;
        
        if (checkTTTWin(state.tttBoard, 'X')) { document.getElementById('game-status-text').innerText = '🎉 You Won!'; return; }
        if (state.tttBoard.every(c=>c!=='')) { document.getElementById('game-status-text').innerText = '🤝 Draw!'; return; }
        
        document.getElementById('game-status-text').innerText = 'AI thinking...';
        setTimeout(() => {
            let empty = state.tttBoard.map((v,i)=>v===''?i:null).filter(v=>v!==null);
            let pick = empty[Math.floor(Math.random()*empty.length)];
            state.tttBoard[pick] = 'O'; document.querySelectorAll('.ttt-cell')[pick].innerText = 'O';
            if (checkTTTWin(state.tttBoard, 'O')) { document.getElementById('game-status-text').innerText = '💀 AI Won!'; return; }
            state.myTurn = true; document.getElementById('game-status-text').innerText = 'Your Turn (X)';
        }, 500);
    }

    function checkTTTWin(board, p) {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return wins.some(w => w.every(i => board[i] === p));
    }

    // ========== HISTORY & UTILS ==========
    async function finishGame(myScore, oppScore) {
        if (state.isPractice) return;
        const isHost = state.roomData.host === USER_ID;
        if (!isHost) return; // Host records the match to avoid duplicates

        const matchRecord = {
            p1: USER_ID, p1Name: USER_NAME, p1Score: myScore,
            p2: state.roomData.guest, p2Name: state.roomData.guestName, p2Score: oppScore,
            game: state.gameType, timestamp: Date.now()
        };
        await fbCall('POST', 'matches', matchRecord);

        let u1 = await fbCall('GET', `users/${USER_ID}`);
        let u2 = await fbCall('GET', `users/${state.roomData.guest}`);
        await fbCall('PATCH', `users/${USER_ID}`, { score: (u1.score||0) + myScore });
        await fbCall('PATCH', `users/${state.roomData.guest}`, { score: (u2.score||0) + oppScore });
    }

    async function loadHistory() {
        const matches = await fbCall('GET', 'matches');
        const container = document.getElementById('history-container');
        if (!matches) { container.innerHTML = '<p>No matches.</p>'; return; }
        let html = '';
        Object.values(matches).reverse().forEach(m => {
            if (m.p1 === USER_ID || m.p2 === USER_ID) {
                const isP1 = m.p1 === USER_ID;
                const diff = isP1 ? m.p1Score - m.p2Score : m.p2Score - m.p1Score;
                const oppName = isP1 ? m.p2Name : m.p1Name;
                html += `<div class="history-item"><div><b>${m.game.toUpperCase()} vs ${oppName}</b></div><div class="${diff>=0?'win':'loss'}">${diff>=0?'+':''}${diff} pts</div></div>`;
            }
        });
        container.innerHTML = html || '<p>No matches.</p>';
    }

    async function saveNickname() { await fbCall('PATCH', `users/${USER_ID}`, { nickname: document.getElementById('my-nickname').value }); alert('Saved'); }
    async function savePrivacy() { await fbCall('PATCH', `users/${USER_ID}`, { showHistory: document.getElementById('privacy-toggle').checked }); }
    
    function leaveRoom() {
        if(state.pollingTimer) clearInterval(state.pollingTimer);
        state.roomId = null; window.history.replaceState({}, '', window.location.pathname);
        switchView('unconnected');
    }
    
    function exitArena() {
        if(state.isPractice) switchView('unconnected');
        else leaveRoom();
    }

    window.onload = init;
</script>
</body>
</html>
